name: ci

on:
  push:
    branches: [main]
  pull_request:
  # On demand, against any ref: the browser job below has to be shown green
  # over three consecutive runs before M5 closes, and a branch without a
  # pull request has nothing else that would start one.
  workflow_dispatch:
  # Called by release.yml, so a release checks its commit by running CI itself
  # rather than restating its steps and drifting from them
  # (davison/md-notes#134).
  workflow_call:

# What every job in this repository's workflows pins, and why
# (davison/md-notes#193). scripts/workflows/pins_test.go holds all four files
# to it.
#
# - The runner is ubuntu-24.04 by name, never ubuntu-latest. The publish
#   workflows check out a tag and run when the Release is published, which can
#   be days later; a label that moved in between (ubuntu-latest became Ubuntu
#   26 on 2026-10-19) could break a channel in a way only a new tag repairs.
#   Moving image is a reviewed one-line change instead.
# - Every action is on a major that runs on Node 24. The Node 20 majors were
#   deprecated on the runners and are forced onto Node 24 until they are
#   refused outright.
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            ui/pnpm-lock.yaml
            extension/pnpm-lock.yaml
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep
      - run: make check
      # A step of its own rather than part of `make check`: this one asks the
      # vulnerability database and the npm registry, so it can go red without
      # the tree having changed, and a red scan should read as "something was
      # published" and not as "the build broke" (davison/md-notes#147). It is
      # in the `check` job because that is the job release.yml calls through
      # workflow_call, so a release is scanned on the same terms as a pull
      # request.
      - name: Scan dependencies for published vulnerabilities
        run: make vuln

  # Browser-level checks: the layout at phone widths, the display settings
  # and the asset cache, in headless Chromium against the built daemon
  # (davison/md-notes#78). A job of its own rather than a step of `check`,
  # so the Go and unit suites still report in their own time and a browser
  # download never sits in front of them.
  e2e:
    runs-on: ubuntu-24.04
    # The whole job is a build and a seven-second suite; anything near this
    # is hung, and a hung job should not hold a runner for six hours.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            ui/pnpm-lock.yaml
            extension/pnpm-lock.yaml
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The daemon lists and searches a root through ripgrep, so a runner
      # without it serves an empty navigator and every check that reads the
      # tree fails for a reason that has nothing to do with the browser.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep
      - run: make ui-deps
      - name: Resolve the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./ui/node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      # Keyed on the version alone: the browser build a release pins never
      # changes, so a hit is always the right Chromium.
      - name: Restore the Chromium download
        id: chromium
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Download Chromium
        run: |
          start=$SECONDS
          pnpm --dir ui exec playwright install --with-deps chromium
          echo "chromium_seconds=$((SECONDS - start))" >> "$GITHUB_ENV"
      - name: Run the suite
        run: |
          start=$SECONDS
          make e2e
          echo "e2e_seconds=$((SECONDS - start))" >> "$GITHUB_ENV"
      - name: Record the per-run cost
        if: always()
        run: |
          {
            echo "| step | seconds |"
            echo "| --- | ---: |"
            echo "| Chromium (cache hit: ${{ steps.chromium.outputs.cache-hit || 'false' }}) | ${chromium_seconds:-n/a} |"
            echo "| make e2e (build and suite) | ${e2e_seconds:-n/a} |"
          } >> "$GITHUB_STEP_SUMMARY"
