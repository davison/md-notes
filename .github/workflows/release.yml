# Cutting a release is two acts: pushing a v<major>.<minor>.<patch> tag, then
# publishing the draft this workflow leaves behind (davison/md-notes#134).
# Everything between them follows from the tag — the version the binaries
# report, the version the extension manifest carries, the assets, the notes.
# The operator's publish is what fires `release: published`, and the channels
# (Chrome Web Store, AUR, .deb) hang off that event, each in its own file, so
# any one of them can be re-run from the Actions page without a new tag.
# docs/releasing.md is the prose account of all of it.
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  # A dry run, so the workflow itself can be exercised without spending a tag:
  # it checks, builds and uploads the artefacts for inspection, and creates no
  # Release, not even a draft.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, e.g. v0.1.0. A dry run: no Release is drafted."
        required: true
        default: v0.0.0

# The release job drafts a Release and uploads its assets; nothing else here
# writes anything.
permissions:
  contents: read

# One release at a time per ref, and never cancelled: two tags pushed together
# would otherwise run two full releases, CI included, side by side, and a
# re-run of a tag would overlap its own first run. Cancelling is the wrong
# remedy here — a half-finished release is worse than a queued one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The commit is checked the way every other commit is checked, by calling CI
  # rather than restating it: both of its jobs, `check` and `e2e`, gate the
  # build below.
  check:
    uses: ./.github/workflows/ci.yml

  release:
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: |
            ui/pnpm-lock.yaml
            extension/pnpm-lock.yaml
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # The tag on a tag push, the dispatch input on a dry run. Read through
      # the environment and checked against the tag pattern before it reaches
      # a command line: it is the one value here that a person types.
      - name: Resolve the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION:-$GITHUB_REF_NAME}"
          # The same shape the tag trigger filters on, anchored to the whole
          # string. Two weaker forms were here first and both let something
          # through: a shell `case` pattern cannot express "digits and nothing
          # else", so v0.1.0-rc1 passed and would have built a release whose
          # manifest silently fell back to the development version; and
          # `grep -E '^…$'` anchors per *line*, so a dispatch input of
          # "v1.2.3" followed by a newline and anything at all passed, and the
          # line below would have written both of them into $GITHUB_OUTPUT.
          # bash's =~ anchors the string. scripts/workflows runs this step.
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "not a v<major>.<minor>.<patch> version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Both static binaries, the extension zip and SHA256SUMS, and the check
      # that the tag, the binary and the manifest all say the same version.
      # The same target the operator runs locally, so a release that fails here
      # fails the same way on a laptop.
      - name: Build the release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: make release VERSION="$VERSION"

      # Kept whatever the trigger, so a dry run has something to inspect and a
      # real release has its assets outside the Release as well.
      - uses: actions/upload-artifact@v7
        with:
          name: mdn-${{ steps.version.outputs.version }}
          path: dist/
          if-no-files-found: error

      # The event, not the ref: a workflow_dispatch can name a tag as its ref,
      # and guarding on the ref would let a dispatch publish — under the
      # dispatch's *input* version, which need not be the tag it ran at. The
      # input's description, the run summary below and the decision recorded on
      # davison/md-notes#134 all say a dispatch never creates a Release, and
      # this is the line that makes that true; scripts/workflows holds a test
      # over it.
      # A draft, and the operator publishes it by hand — the gate resolved on
      # davison/md-notes#133. A Release created with GITHUB_TOKEN starts no
      # workflow of its own ("events triggered by the GITHUB_TOKEN will not
      # create a new workflow run"), so a Release published from here would
      # never reach the channel workflows that hang off `release: published`.
      # A person clicking Publish is not that token, so it does. The operator
      # reads the generated notes before the release goes out either way.
      - name: Draft the GitHub Release
        id: draft
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          url=$(gh release create "$VERSION" dist/* --draft --title "$VERSION" --generate-notes --verify-tag)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Say what was built
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DRAFT_URL: ${{ steps.draft.outputs.url }}
        run: |
          {
            if [ "${{ github.event_name }}" != "push" ]; then
              echo "Dry run of **$VERSION**: built and uploaded as an artifact, no Release created."
            else
              echo "Draft created for **$VERSION**: <$DRAFT_URL>"
              echo
              echo "It is a **draft**. Read the generated notes and publish it from that page:"
              echo "publishing is what fires \`release: published\` and starts the channel workflows."
            fi
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
