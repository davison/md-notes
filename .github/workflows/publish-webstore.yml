# Publishes a release's extension zip to the Chrome Web Store
# (davison/md-notes#135, M8-R2).
#
# One of the channel workflows that hang off a published Release — its own
# file, like the AUR and .deb ones, so a channel that fails can be re-run on
# its own from the Actions page against the same release without cutting
# another tag. docs/releasing.md is the prose account; scripts/workflows holds
# tests over the properties below that a reader would not notice the loss of.
#
# It uploads. It does not build: the zip is the release's own asset, built from
# the tag by release.yml, and this workflow checks it against the release's
# SHA256SUMS before sending it, so what reaches the store is byte for byte what
# the release page offers.
name: publish-webstore

# `release: published` and nothing else. Not `created`, which also fires for a
# draft, and not `released`, which does not fire for a pre-release: `published`
# is the one the operator's press on the draft's Publish button emits, and the
# gate resolved on davison/md-notes#133 makes that press the start of every
# channel.
#
# There is deliberately no `workflow_dispatch` here. A failed channel is re-run
# with GitHub's own re-run, which replays this event with its release payload;
# a dispatch would add a second path to the store that carries no release with
# it and would have to be told which tag to trust. The one way in is a release
# somebody published.
on:
  release:
    types: [published]

# Reading the release's assets is all this needs. The credentials that can write
# anything are the store's, not GitHub's.
permissions:
  contents: read

# One upload at a time. The store refuses a package uploaded while another is
# in flight for the same item, and two releases published a minute apart would
# otherwise race; never cancelled, because an upload abandoned half way is
# worse than one that waits.
concurrency:
  group: publish-webstore
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # A `release` event runs at the release's own commit, so the default
      # checkout is the tagged tree: the publishing script that ships with the
      # release is the one that publishes it.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # The tag, the asset name built from it, and the version the package
      # should carry. All three are in docs/releasing.md: the asset is
      # `mdn-extension-<version>.zip` with the version spelled exactly as the
      # tag, leading `v` and all, and only the places that cannot take a `v` —
      # the extension manifest among them — get the stripped form. Read through
      # the environment and checked before any of it reaches a command line.
      - name: Resolve the release
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "not a v<major>.<minor>.<patch> release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "asset=mdn-extension-$RELEASE_TAG.zip" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      # Before anything is downloaded, so a missing credential fails in the
      # first ten seconds saying which one, rather than after a download and
      # inside somebody else's API. Only the names are ever printed.
      - name: Check the store credentials are configured
        env:
          CHROME_WEBSTORE_CLIENT_ID: ${{ secrets.CHROME_WEBSTORE_CLIENT_ID }}
          CHROME_WEBSTORE_CLIENT_SECRET: ${{ secrets.CHROME_WEBSTORE_CLIENT_SECRET }}
          CHROME_WEBSTORE_REFRESH_TOKEN: ${{ secrets.CHROME_WEBSTORE_REFRESH_TOKEN }}
          CHROME_WEBSTORE_PUBLISHER_ID: ${{ vars.CHROME_WEBSTORE_PUBLISHER_ID }}
          CHROME_WEBSTORE_ITEM_ID: ${{ vars.CHROME_WEBSTORE_ITEM_ID }}
        run: |
          missing=()
          for name in CHROME_WEBSTORE_CLIENT_ID CHROME_WEBSTORE_CLIENT_SECRET \
                      CHROME_WEBSTORE_REFRESH_TOKEN CHROME_WEBSTORE_PUBLISHER_ID \
                      CHROME_WEBSTORE_ITEM_ID; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "not configured: ${missing[*]}" >&2
            echo "The first three are repository secrets and the last two are repository" >&2
            echo "variables; davison/md-notes#135 records how each is made." >&2
            exit 1
          fi

      # The release's own asset, by the name docs/releasing.md gives it, and
      # its checksum line. Not a fresh build: a store package that is not the
      # one on the release page, under the same version, is the one mismatch
      # nobody would ever find.
      - name: Download the release's extension zip
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          ASSET: ${{ steps.release.outputs.asset }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$ASSET" --pattern SHA256SUMS --dir .
          ls -l "$ASSET" SHA256SUMS

      # Provenance is not verification: `gh release download` checks nothing,
      # and a truncated or replaced asset reaches the store as a package it
      # rejects for reasons that look like anything but this. --ignore-missing
      # because SHA256SUMS covers the binaries too and only the zip is here.
      - name: Check the zip against the release's checksums
        env:
          ASSET: ${{ steps.release.outputs.asset }}
        run: |
          # `|| true` because a `run:` step is `bash -e`: a failing sha256sum
          # would otherwise kill the step at this assignment, before the
          # message below could say which file was not verified. Its own
          # warnings still reach the log on stderr, and the assertion that
          # follows is the one that decides.
          checked=$(sha256sum --ignore-missing --check SHA256SUMS) || true
          echo "$checked"
          # --check is happy having verified nothing at all, so the asset's own
          # OK line is what is asserted, not the exit status.
          if ! grep -qxF "$ASSET: OK" <<<"$checked"; then
            echo "SHA256SUMS did not verify $ASSET: either the asset this job downloaded is not the one the release was built from, or SHA256SUMS does not cover it at all" >&2
            exit 1
          fi

      # The version inside the package, compared rather than printed. The store
      # refuses a package whose version is not higher than the published one,
      # so a zip carrying 0.0.0 — what an untagged build stamps — would fail as
      # a store error about versions rather than as this workflow saying the
      # release's asset is not the release's version. relcheck catches it at
      # build time; this catches it at the only moment the store is involved.
      - name: Check the package carries this release's version
        env:
          ASSET: ${{ steps.release.outputs.asset }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          unzip -p "$ASSET" manifest.json > manifest-in-the-package.json
          version=$(node -p 'JSON.parse(require("fs").readFileSync("manifest-in-the-package.json","utf8")).version')
          echo "the package carries version $version"
          if [ "$version" != "$VERSION" ]; then
            echo "but this release is $VERSION: the asset is not this release's package" >&2
            exit 1
          fi

      # Three calls: the refresh-token grant, the package POST, the publish
      # that submits it for review. extension/scripts/webstore.mjs makes them
      # against the Chrome Web Store V2 API and writes what the store said into
      # the run summary; its request shaping and its reading of every documented
      # response state are tested against a fake server in
      # extension/scripts/webstore.test.mjs.
      - name: Upload to the Chrome Web Store and submit for review
        env:
          CHROME_WEBSTORE_CLIENT_ID: ${{ secrets.CHROME_WEBSTORE_CLIENT_ID }}
          CHROME_WEBSTORE_CLIENT_SECRET: ${{ secrets.CHROME_WEBSTORE_CLIENT_SECRET }}
          CHROME_WEBSTORE_REFRESH_TOKEN: ${{ secrets.CHROME_WEBSTORE_REFRESH_TOKEN }}
          PUBLISHER_ID: ${{ vars.CHROME_WEBSTORE_PUBLISHER_ID }}
          ITEM_ID: ${{ vars.CHROME_WEBSTORE_ITEM_ID }}
          ASSET: ${{ steps.release.outputs.asset }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          node extension/scripts/webstore.mjs \
            --publisher-id "$PUBLISHER_ID" \
            --item-id "$ITEM_ID" \
            --zip "$ASSET" \
            --expect-version "$VERSION"

      # The store's review takes days and is nobody here's to hurry; a run that
      # failed should say where to look and what re-running does.
      - name: Say what failed
        if: failure()
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          {
            echo "**$TAG was not submitted to the Chrome Web Store.** The step log above says why."
            echo
            echo "Nothing else about the release is affected: the release page, its assets and the"
            echo "other channels stand. Fix the cause and re-run this workflow from the Actions"
            echo "page — it replays this release, and uploads the same asset again."
          } >> "$GITHUB_STEP_SUMMARY"
