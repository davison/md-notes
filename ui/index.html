<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      interactive-widget=resizes-content: Chromium's default is to leave the
      layout viewport alone when the on-screen keyboard opens and shrink only
      the visual one, which on a shell sized in dvh puts the caret and the note
      bar under the keyboard with no way to scroll to them. Resizing the
      content instead gives the editor the space that is left.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
    />
    <title>MD Notes</title>
    <!--
      crossorigin="use-credentials" is not decoration: a manifest is fetched
      with credentials omitted unless it is asked for, and over the tailnet a
      request without the session cookie is answered with the login page — so
      the manifest would never parse and no browser would offer to install
      the app. Same origin either way.
    -->
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <!-- The manifest carries one theme colour; these two follow the device's
         scheme, and are the page backgrounds in ui/src/style.css. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fbfbfa" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1b1b1b" />
    <!--
      The display settings, before the stylesheet paints: a reader who has
      overridden a dark device to light must not see a frame of the scheme
      they overrode. The bundle is a deferred module and runs too late for
      that, so this is inline and duplicated from ui/src/settings.ts, whose
      BOOT export is held to this text by a test.
    -->
    <script>
      var s={};try{s=JSON.parse(localStorage.getItem("mdn:settings"))||{}}catch(e){}if(s.light)document.documentElement.setAttribute("data-theme","light");if(s.noMotion)document.documentElement.setAttribute("data-motion","none");
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
